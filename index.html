<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Friends - Discord</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    body { background: #36393f; font-family: system-ui, -apple-system, sans-serif; }
    .discord-bg { background: #36393f; }
    .card { background: #2f3136; }
    .badge { display: inline-flex; align-items: center; gap: 3px; font-size: 12px; padding: 1px 6px; border-radius: 4px; }
  </style>
</head>
<body class="min-h-screen text-white pb-20">

  <!-- Top Bar -->
  <div class="sticky top-0 bg-[#2f3136] border-b border-gray-700 px-4 py-3 flex items-center justify-between z-50">
    <div class="flex items-center gap-3">
      <i class="fas fa-user-friends text-indigo-400"></i>
      <h1 class="font-semibold text-lg">Friends</h1>
    </div>
    <div class="flex items-center gap-4 text-xl">
      <i onclick="addFriend()" class="fas fa-user-plus cursor-pointer hover:text-indigo-400"></i>
    </div>
  </div>

  <!-- Profile List -->
  <div class="p-3 space-y-2 max-w-xl mx-auto" id="profile-list">
    <!-- Populated by JS -->
  </div>

  <!-- Profile Modal -->
  <div id="profile-modal" class="hidden fixed inset-0 bg-black/80 flex items-end lg:items-center justify-center z-50">
    <div class="bg-[#2f3136] w-full max-w-md lg:rounded-xl overflow-hidden">
      <!-- Modal Content will be injected by JS -->
    </div>
  </div>

<script>
// Sample Users with Real Nitro Badges
const users = [
  {
    display: "Alex Chen",
    username: "alexchen",
    avatar: "https://i.pravatar.cc/128?u=alex",
    status: "online",
    about: "UI Designer & Gamer • Always up for a ranked match",
    badges: [
      { emoji: "🔷", label: "Nitro" },
      { emoji: "🏆", label: "5 Year" },
      { emoji: "⭐", label: "Early Supporter" },
      { emoji: "🚀", label: "Server Booster" }
    ]
  },
  {
    display: "Mia Rodriguez",
    username: "miarose",
    avatar: "https://i.pravatar.cc/128?u=mia",
    status: "idle",
    about: "Digital artist & cat mom 🐱",
    badges: [
      { emoji: "🔷", label: "Nitro" },
      { emoji: "🏆", label: "5 Year" }
    ]
  },
  {
    display: "Kai Nakamura",
    username: "kainaka",
    avatar: "https://i.pravatar.cc/128?u=kai",
    status: "dnd",
    about: "FPS Grinder | Valorant & CS2",
    badges: [
      { emoji: "⭐", label: "Early Supporter" },
      { emoji: "🚀", label: "Server Booster" }
    ]
  },
  {
    display: "Luna Park",
    username: "lunarp",
    avatar: "https://i.pravatar.cc/128?u=luna",
    status: "online",
    about: "Streaming & chill vibes",
    badges: [
      { emoji: "🔷", label: "Nitro" },
      { emoji: "🏆", label: "5 Year" },
      { emoji: "⭐", label: "Early Supporter" }
    ]
  }
];

function getStatusColor(status) {
  if (status === "online") return "bg-green-500";
  if (status === "idle") return "bg-yellow-500";
  if (status === "dnd") return "bg-red-500";
  return "bg-gray-500";
}

function renderProfiles() {
  const container = document.getElementById('profile-list');
  container.innerHTML = '';

  users.forEach((user, index) => {
    const div = document.createElement('div');
    div.className = `card rounded-xl p-4 flex gap-4 items-center cursor-pointer active:scale-95 transition`;
    div.innerHTML = `
      <div class="relative">
        <img src="${user.avatar}" class="w-14 h-14 rounded-full ring-2 ring-gray-700">
        <div class="absolute bottom-0 right-0 w-5 h-5 rounded-full border-2 border-[#2f3136] ${getStatusColor(user.status)}"></div>
      </div>
      <div class="flex-1 min-w-0">
        <div class="flex items-center gap-2">
          <span class="font-semibold text-lg truncate">${user.display}</span>
        </div>
        <div class="text-gray-400 text-sm">@${user.username}</div>
        <div class="flex gap-1 mt-2 flex-wrap">
          ${user.badges.map(b => `
            <span class="badge bg-gradient-to-r from-indigo-600 to-purple-600 text-white">
              ${b.emoji} ${b.label}
            </span>
          `).join('')}
        </div>
      </div>
    `;
    div.onclick = () => showProfile(user);
    container.appendChild(div);
  });
}

function showProfile(user) {
  const modal = document.getElementById('profile-modal');
  modal.classList.remove('hidden');
  
  const content = modal.querySelector('div');
  content.innerHTML = `
    <div class="h-28 bg-gradient-to-r from-indigo-600 to-purple-600 relative">
      <button onclick="closeModal()" class="absolute top-3 right-3 text-white text-2xl">✕</button>
    </div>
    
    <div class="px-5 -mt-10 relative">
      <img src="${user.avatar}" class="w-24 h-24 rounded-full border-4 border-[#2f3136]">
      
      <div class="mt-3">
        <div class="flex items-center gap-2">
          <span class="font-bold text-2xl">${user.display}</span>
        </div>
        <div class="text-gray-400">@${user.username}</div>
      </div>

      <div class="flex gap-2 mt-4 flex-wrap">
        ${user.badges.map(b => `
          <span class="badge bg-gradient-to-r from-indigo-600 to-purple-600 text-white text-sm py-1 px-3">
            ${b.emoji} ${b.label}
          </span>
        `).join('')}
      </div>

      <div class="mt-6">
        <p class="text-gray-300 text-sm">${user.about}</p>
      </div>

      <div class="mt-8 grid grid-cols-2 gap-3 pb-8">
        <button onclick="closeModal()" class="py-3 bg-[#40444b] rounded-xl font-medium">Message</button>
        <button onclick="closeModal()" class="py-3 bg-[#40444b] rounded-xl font-medium">Add Friend</button>
      </div>
    </div>
  `;
}

function closeModal() {
  document.getElementById('profile-modal').classList.add('hidden');
}

function addFriend() {
  alert("Friend request feature coming soon! 👀");
}

// Initialize
window.onload = renderProfiles;
</script>
</body>
</html></html>
