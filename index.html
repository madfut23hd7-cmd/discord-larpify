<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>You - Discord</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    body {
      background: #36393f;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      max-width: 428px;
      margin: 0 auto;
      height: 100vh;
      overflow: hidden;
      color: #dcddde;
    }
    .banner {
      height: 190px;
      background-size: cover;
      background-position: center;
      position: relative;
    }
    .banner::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(transparent, #36393f 75%);
    }
    .avatar-ring {
      box-shadow: 0 0 0 8px #36393f;
    }
    .badge {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      object-fit: contain;
    }
    .menu-item {
      padding: 16px 20px;
      font-size: 17px;
      font-weight: 500;
    }
  </style>
</head>
<body class="flex flex-col">

  <!-- iOS Status Bar -->
  <div class="h-12 bg-[#2f3136] flex items-end justify-end pr-6 text-[13px] font-medium">
    <span id="time">9:41</span>
  </div>

  <!-- Header -->
  <div class="bg-[#2f3136] px-4 py-3 flex items-center justify-between border-b border-[#202225]">
    <div class="text-2xl font-semibold tracking-tight">You</div>
    <div onclick="editProfile()" class="text-[#5865f2] font-semibold flex items-center gap-1.5">
      <i class="fas fa-pen text-sm"></i>
      <span>Edit Profile</span>
    </div>
  </div>

  <div class="flex-1 overflow-auto pb-20">
    <!-- Banner -->
    <div class="relative">
      <div id="banner" onclick="changeBanner()" 
           class="banner bg-gradient-to-br from-violet-600 to-fuchsia-600 cursor-pointer">
      </div>
      
      <!-- Avatar -->
      <div class="absolute -bottom-14 left-6">
        <div onclick="changeAvatar()" class="relative cursor-pointer">
          <img id="avatar" src="https://i.pravatar.cc/256?u=default" 
               class="w-[132px] h-[132px] rounded-full avatar-ring border-[6px] border-[#36393f]">
          <div id="status-dot" onclick="cycleStatus(event)" 
               class="absolute bottom-3 right-3 w-9 h-9 bg-green-500 rounded-full border-[4px] border-[#36393f] cursor-pointer"></div>
        </div>
      </div>
    </div>

    <div class="pt-20 px-5 space-y-8">

      <!-- Name Section -->
      <div>
        <div onclick="editDisplayName()" id="display-name" 
             class="text-3xl font-bold text-white cursor-pointer">Your Display Name</div>
        <div class="flex items-center gap-2 mt-1">
          <div onclick="editUsername()" id="username" 
               class="text-[#b9bbbe] text-[17px] cursor-pointer">@yourusername</div>
          <div onclick="editPronouns()" id="pronouns" 
               class="text-[#949ba4] text-base cursor-pointer">he/him</div>
        </div>
      </div>

      <!-- Badges -->
      <div>
        <div class="text-xs uppercase tracking-widest text-[#949ba4] font-semibold mb-3">BADGES</div>
        <div id="badges-container" class="flex flex-wrap gap-3"></div>
      </div>

      <!-- About Me -->
      <div>
        <div class="text-xs uppercase tracking-widest text-[#949ba4] font-semibold mb-2">ABOUT ME</div>
        <div onclick="editBio()" id="bio" 
             class="text-[15px] leading-relaxed text-[#dcddde] cursor-pointer min-h-[80px]">
          Tap to write something about yourself...
        </div>
      </div>

      <!-- Nitro -->
      <div onclick="showNitro()" class="bg-[#2f3136] rounded-xl p-4 flex items-center justify-between cursor-pointer active:bg-[#36393f]">
        <div class="flex items-center gap-3">
          <img src="https://i.imgur.com/2Q9z2vD.png" class="w-11 h-11" alt="Nitro">
          <div>
            <div class="font-semibold">Nitro</div>
            <div class="text-emerald-400 text-sm">Active • Expires Dec 2026</div>
          </div>
        </div>
        <i class="fas fa-chevron-right text-gray-400"></i>
      </div>

      <!-- Menu -->
      <div class="bg-[#2f3136] rounded-xl overflow-hidden text-[17px]">
        <div class="menu-item border-b border-[#202225] flex justify-between items-center">
          <span>My Account</span>
          <i class="fas fa-chevron-right text-gray-400"></i>
        </div>
        <div class="menu-item border-b border-[#202225] flex justify-between items-center">
          <span>Privacy & Safety</span>
          <i class="fas fa-chevron-right text-gray-400"></i>
        </div>
        <div class="menu-item border-b border-[#202225] flex justify-between items-center">
          <span>Authorized Apps</span>
          <i class="fas fa-chevron-right text-gray-400"></i>
        </div>
        <div onclick="logout()" class="menu-item text-red-400">Log Out</div>
      </div>
    </div>
  </div>

  <!-- Bottom Navigation -->
  <div class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[428px] h-14 bg-[#2f3136] border-t border-[#202225] flex items-center justify-around text-3xl">
    <i class="fas fa-users text-gray-400"></i>
    <i class="fas fa-message text-gray-400"></i>
    <i class="fas fa-compass text-gray-400"></i>
    <i class="fas fa-user text-[#5865f2]"></i>
  </div>

<script>
// Profile Data
let profile = {
  displayName: "Your Display Name",
  username: "yourusername",
  pronouns: "he/him",
  avatar: "https://i.pravatar.cc/256?u=default",
  banner: "https://picsum.photos/id/1015/800/300",
  bio: "Just vibing in the digital realm ✨ Building cool stuff and collecting badges.",
  status: "online",
  selectedBadges: ["nitro", "5year", "dev", "early"]
};

const allBadges = [
  { id: "nitro", name: "Nitro", img: "https://i.imgur.com/2Q9z2vD.png" },
  { id: "5year", name: "5 Year Nitro", img: "https://i.imgur.com/8z5zZ3k.png" },
  { id: "early", name: "Early Supporter", img: "https://i.imgur.com/early.png" },
  { id: "dev", name: "Active Developer", img: "https://i.imgur.com/activedev.png" },
  { id: "hypesquad", name: "HypeSquad", img: "https://i.imgur.com/hypesquad.png" },
];

// Render Functions
function renderProfile() {
  document.getElementById('display-name').textContent = profile.displayName;
  document.getElementById('username').textContent = '@' + profile.username;
  document.getElementById('pronouns').textContent = profile.pronouns;
  document.getElementById('avatar').src = profile.avatar;
  document.getElementById('banner').style.backgroundImage = `url('${profile.banner}')`;
  document.getElementById('bio').textContent = profile.bio;
  renderBadges();
}

function renderBadges() {
  const container = document.getElementById('badges-container');
  container.innerHTML = '';
  
  profile.selectedBadges.forEach(id => {
    const badge = allBadges.find(b => b.id === id);
    if (!badge) return;
    const img = document.createElement('img');
    img.src = badge.img;
    img.className = "badge";
    img.title = badge.name;
    container.appendChild(img);
  });
}

// Edit Functions
function editDisplayName() { const val = prompt("Display Name:", profile.displayName); if(val) {profile.displayName = val; renderProfile();} }
function editUsername() { const val = prompt("Username:", profile.username); if(val) {profile.username = val.toLowerCase(); renderProfile();} }
function editPronouns() { const val = prompt("Pronouns:", profile.pronouns); if(val !== null) {profile.pronouns = val; renderProfile();} }
function changeAvatar() { const url = prompt("Avatar URL:", profile.avatar); if(url) {profile.avatar = url; renderProfile();} }
function changeBanner() { const url = prompt("Banner URL:", profile.banner); if(url) {profile.banner = url; renderProfile();} }
function editBio() { const val = prompt("About Me:", profile.bio); if(val !== null) {profile.bio = val; renderProfile();} }

function cycleStatus(e) {
  e.stopImmediatePropagation();
  const colors = {online:"bg-green-500", idle:"bg-yellow-500", dnd:"bg-red-500", invisible:"bg-gray-500"};
  const order = ["online","idle","dnd","invisible"];
  profile.status = order[(order.indexOf(profile.status)+1)%4];
  document.getElementById('status-dot').className = `absolute bottom-3 right-3 w-9 h-9 rounded-full border-[4px] border-[#36393f] ${colors[profile.status]}`;
}

function editProfile() { alert("Full Edit Profile screen (real Discord style)"); }
function showNitro() { alert("Nitro Management • Perks • Shop"); }
function logout() { if(confirm("Log out?")) alert("Logged out"); }

// Init
window.onload = () => {
  renderProfile();
  document.getElementById('time').textContent = new Date().toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
};
</script>
</body>
</html></html></html></html></html></html>
